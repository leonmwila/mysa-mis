name: Build and Push GHCR Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mysa-mis
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-latest,enable={{is_default_branch}}
            type=raw,value=production-latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-production:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on:
      - self-hosted
      - linux
      - x64
      - k8s-prod
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Write kubeconfig
        env:
          KUBECONFIG_PRODUCTION: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_PRODUCTION" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Validate kubeconfig endpoint
        run: |
          SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          echo "Using API server: $SERVER"
          if [[ -z "$SERVER" ]]; then
            echo "ERROR: kubeconfig secret is empty or invalid (no cluster server found)."
            exit 1
          fi
          if [[ "$SERVER" =~ 127\.0\.0\.1|localhost ]]; then
            echo "ERROR: kubeconfig server points to localhost."
            echo "Update KUBECONFIG_PRODUCTION secret to use your VM IP/DNS (for example: https://10.21.1.25:6443)."
            exit 1
          fi

      - name: Verify cluster access
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Deploy production from GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          cd "k8s/overlays/production"
          kustomize edit set image "ghcr.io/$OWNER/mysa-mis=ghcr.io/$OWNER/mysa-mis:$IMAGE_TAG"
          kustomize build . | kubectl apply -f -
          kubectl -n mysa-mis rollout status deployment/odoo --timeout=300s
